<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Posti liberi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Template "Posti liberi" Greta L. Beauty Studio */
  :root{
    --bg:#E7DED5; --ink:#1E1E1E; --accent:#7A5E1B; --kicker:#7A5C50;
    --line:#C9C0B5; --foot:#4F463E;
    --display:'Playfair Display', Georgia, serif; --body:'Montserrat', system-ui, sans-serif;
    --x:100px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px}
  body{background:var(--bg); color:var(--ink); font-family:var(--body); position:relative; overflow:hidden}
  .kicker{position:absolute; left:var(--x); top:331px; font-size:25px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--kicker)}
  h1{position:absolute; left:var(--x); top:384px; font-family:var(--display); font-weight:400; font-size:80px; line-height:1}
  h1 em{color:var(--accent)}
  .days{position:absolute; left:var(--x); right:102px; top:494px}
  .day{display:flex; align-items:center; height:101px; border-bottom:1.5px solid var(--line)}
  .day:first-child{height:91px}
  .dname{width:254px; font-size:35px; font-weight:400; color:var(--ink)}
  .slots{font-family:var(--display); font-size:41px; color:var(--accent); font-variant-numeric:oldstyle-nums}
  .foot{position:absolute; left:var(--x); font-size:27px; line-height:35px; color:var(--foot)}
  .logo{position:absolute; left:50%; top:1450px; height:145px; transform:translateX(-50%)}
</style>
</head>
<body>
  <div class="kicker">Da lunedì 23 a sabato 28</div>
  <h1>Posti <em>liberi</em></h1>

  <div class="days">
    <div class="day"><div class="dname">Lunedì 23</div><div class="slots">18:00</div></div>
    <div class="day"><div class="dname">Martedì 24</div><div class="slots">13:30</div></div>
    <div class="day"><div class="dname">Mercoledì 25</div><div class="slots">12:00–13:00</div></div>
    <div class="day"><div class="dname">Venerdì 27</div><div class="slots">8:00–10:30 · 13:30 · 18:00</div></div>
    <div class="day"><div class="dname">Sabato 28</div><div class="slots">13:00 · 15:00–18:00</div></div>
  </div>

  <div class="foot" id="foot">Giovedì è pieno.<br>Prenoti dal link qui sotto.</div>
  <img class="logo" src="logo-gl.png" alt="Greta L. Beauty Studio">
  <script>
    // nota sempre ~35px sotto l'ultima riga, come nel template
    const d=document.querySelector('.days').getBoundingClientRect();
    document.getElementById('foot').style.top=(d.bottom+38)+'px';
  </script>
</body>
</html>
